[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecleaner"
version = "0.1.0"
description = "Safe code cleanup and AI artifact analysis engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codecleaner = "codecleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
